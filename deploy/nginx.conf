server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export uses directory/index.html with trailing slashes.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # Make sure /section/ resolves even without the trailing slash.
    location ~ ^/([a-z-]+)$ {
        return 301 /$1/;
    }

    # Clean, friendly 404 from the static export.
    error_page 404 /404.html;

    # Immutable Next.js assets and pagefind chunks.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /_pagefind/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(woff2?|svg|png|jpg|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
